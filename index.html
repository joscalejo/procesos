<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesos de Ciberseguridad (CB05) — Academia de Preparación para el Examen Parcial</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            executive: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#090d16'
            }
          }
        }
      }
    }
  </script>

  <!-- Tipografía Ejecutiva -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      line-height: 1.7;
    }
    code, pre, .font-mono { 
      font-family: 'JetBrains Mono', monospace; 
    }

    /* Colores Semánticos con Borde Izquierdo Sutil (WCAG AA) */
    .block-rule {
      border-left: 4px solid #2563eb;
      background: rgba(37, 99, 235, 0.06);
    }
    .dark .block-rule {
      border-left: 4px solid #60a5fa;
      background: rgba(59, 130, 246, 0.12);
    }

    .block-example {
      border-left: 4px solid #059669;
      background: rgba(5, 150, 105, 0.06);
    }
    .dark .block-example {
      border-left: 4px solid #34d399;
      background: rgba(16, 185, 129, 0.12);
    }

    .block-warning {
      border-left: 4px solid #d97706;
      background: rgba(217, 119, 6, 0.07);
    }
    .dark .block-warning {
      border-left: 4px solid #fbbf24;
      background: rgba(245, 158, 11, 0.13);
    }

    .block-danger {
      border-left: 4px solid #e11d48;
      background: rgba(225, 29, 72, 0.06);
    }
    .dark .block-danger {
      border-left: 4px solid #fb7185;
      background: rgba(244, 63, 94, 0.12);
    }

    .block-method {
      border-left: 4px solid #7c3aed;
      background: rgba(124, 58, 237, 0.06);
    }
    .dark .block-method {
      border-left: 4px solid #a78bfa;
      background: rgba(139, 92, 246, 0.12);
    }

    /* Estilos de Impresión */
    @media print {
      header, nav, #themeToggle, button, textarea, .toc-sidebar {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
        font-size: 11pt !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
      }
      .answer-box {
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-executive-900 dark:bg-[#0b1120] dark:text-[#f1f5f9] antialiased min-h-screen transition-colors duration-150 overflow-x-hidden">

  <!-- ============================================================== -->
  <!-- BARRA DE NAVEGACIÓN PRINCIPAL -->
  <!-- ============================================================== -->
  <header class="sticky top-0 z-50 w-full border-b border-executive-200 dark:border-executive-800 bg-white/95 dark:bg-[#0b1120]/95 backdrop-blur-sm px-3 sm:px-8 py-2.5 sm:py-3">
    <div class="w-full flex flex-col gap-2">
      
      <!-- FILA SUPERIOR: LOGO, SELECTOR PARCIAL/FINAL Y HERRAMIENTAS -->
      <div class="flex items-center justify-between gap-2 sm:gap-4">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-lg bg-executive-900 dark:bg-executive-100 text-white dark:text-executive-900 flex items-center justify-center font-bold text-xs tracking-tight shrink-0">
            CB05
          </div>
          <div class="min-w-0">
            <span class="text-[10px] sm:text-[11px] uppercase tracking-wider font-semibold text-executive-500 dark:text-executive-400 truncate block">Procesos de Ciberseguridad &middot; UPC</span>
            <h1 class="text-xs sm:text-sm font-bold text-executive-900 dark:text-white leading-tight truncate">Guía de Estudio (CB05)</h1>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <!-- SELECTOR DE ETAPA: PARCIAL (ACTIVO) / FINAL (PREPARADO) -->
          <div class="hidden md:flex items-center rounded-lg border border-executive-200 dark:border-executive-800 p-0.5 bg-executive-100/80 dark:bg-executive-900 text-xs font-semibold">
            <span class="px-2.5 py-1 rounded-md bg-white dark:bg-executive-800 text-executive-900 dark:text-white shadow-xs cursor-default">
              Parcial (S1–S7)
            </span>
            <span class="px-2.5 py-1 rounded-md text-executive-400 dark:text-executive-500 cursor-not-allowed opacity-60" title="Final (S9–S15) se habilitará tras la semana 8">
              Final (S9–S15)
            </span>
          </div>

          <!-- CONTROL DE TEMA -->
          <button id="themeToggle" class="px-2 sm:px-3 py-1.5 rounded-lg border border-executive-200 dark:border-executive-800 text-executive-700 dark:text-executive-300 hover:bg-executive-100 dark:hover:bg-executive-850 transition text-xs font-medium flex items-center gap-1.5" title="Cambiar tema visual">
            <span id="themeIcon">🌙</span>
            <span id="themeLabel">Modo Oscuro</span>
          </button>
          
          <!-- BOTÓN MENÚ MÓVIL (HAMBURGUESA) -->
          <button id="mobileMenuBtn" onclick="toggleMobileMenu()" class="sm:hidden p-2 rounded-lg border border-executive-200 dark:border-executive-800 text-executive-700 dark:text-executive-300" aria-label="Abrir menú">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>
      </div>

      <!-- FILA INFERIOR: BARRA DE NAVEGACIÓN LIMPIA (4 ENTRADAS) -->
      <nav id="mainNav" class="hidden sm:flex flex-col sm:flex-row sm:items-center gap-1.5 pt-1 text-xs font-semibold text-executive-600 dark:text-executive-300">
        <button onclick="navigateTo('view-session', 's1'); closeMobileMenu();" id="nav-view-session" class="nav-btn text-left sm:text-center px-3 py-1.5 rounded-lg hover:bg-executive-100 dark:hover:bg-executive-800 transition">
          📚 Sesiones (S1–S7)
        </button>
        <button onclick="navigateTo('view-detective'); closeMobileMenu();" id="nav-view-detective" class="nav-btn text-left sm:text-center px-3 py-1.5 rounded-lg hover:bg-executive-100 dark:hover:bg-executive-800 transition">
          🔍 Detective de Categorías
        </button>
        <button onclick="navigateTo('view-raci'); closeMobileMenu();" id="nav-view-raci" class="nav-btn text-left sm:text-center px-3 py-1.5 rounded-lg hover:bg-executive-100 dark:hover:bg-executive-800 transition">
          📊 Matriz RACI
        </button>
        <button onclick="navigateTo('view-reference'); closeMobileMenu();" id="nav-view-reference" class="nav-btn text-left sm:text-center px-3 py-1.5 rounded-lg hover:bg-executive-100 dark:hover:bg-executive-800 transition">
          📖 Marcos de referencia
        </button>
      </nav>

    </div>
  </header>

  <!-- ============================================================== -->
  <!-- CONTENEDORES DE VISTA DINÁMICOS (ANCHO COMPLETO FLUIDO) -->
  <!-- ============================================================== -->
  <main class="w-full px-4 sm:px-8 lg:px-12 py-8 space-y-12">

    <!-- VISTA 1: RENDERIZADOR UNIVERSAL DE SESIONES (S1 A S7) -->
    <section id="view-session" class="app-view">
      <div id="session-render-container"></div>
    </section>

    <!-- VISTA 2: DETECTIVE DE CATEGORÍAS NIST CSF 2.0 -->
    <section id="view-detective" class="app-view hidden">
      <div id="detective-container"></div>
    </section>

    <!-- VISTA 3: MATRIZ RACI (GV.RR) -->
    <section id="view-raci" class="app-view hidden">
      <div id="raci-container"></div>
    </section>

    <!-- VISTA 4: MARCOS DE REFERENCIA (NIST CSF 2.0, NIST SP 800-207, CIS CONTROLS V8.1) -->
    <section id="view-reference" class="app-view hidden">
      <div id="reference-container"></div>
    </section>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="w-full px-4 sm:px-8 lg:px-12 py-8 border-t border-executive-200 dark:border-executive-800 text-xs text-executive-500 flex flex-col sm:flex-row justify-between items-center gap-4">
    <p>Procesos de Ciberseguridad (CB05) &middot; Guía de Estudio para el Examen Parcial</p>
    <p>NIST CSF 2.0 &middot; NIST SP 800-207 &middot; CIS Controls v8.1</p>
  </footer>

  <!-- ============================================================== -->
  <!-- CARGA MODULAR DE CONTENIDOS Y APLICACIÓN -->
  <!-- ============================================================== -->
  <script src="content/conceptos.js"></script>
  <script src="content/reference.js"></script>
  <script src="content/sesion1.js"></script>
  <script src="content/sesion2.js"></script>
  <script src="content/sesion3.js"></script>
  <script src="content/sesion4.js"></script>
  <script src="content/sesion5.js"></script>
  <script src="content/sesion6.js"></script>
  <script src="content/sesion7.js"></script>
  <script src="content/raci.js"></script>
  <script src="content/detective.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
